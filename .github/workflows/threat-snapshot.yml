name: Refresh threat-map snapshot

# Fetches the CISA Known Exploited Vulnerabilities catalog (which browsers
# cannot fetch directly — no CORS headers), SANS DShield source and top-port
# rankings (geolocated server-side; topports uses the previous UTC day).
# ThreatFox IOCs are disabled
# unless explicitly enabled after commercial-use eligibility is confirmed
# or a paid subscription is obtained. The job also fetches NVD data and
# publishes one normalized same-origin snapshot every 15 minutes. It runs
# a Pages deployment only when the snapshot content or provider status changes.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  snapshot:
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit: ${{ steps.commit.outputs.commit }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build snapshots
        env:
          ENABLE_THREATFOX: ${{ vars.ENABLE_THREATFOX }}
          THREATFOX_AUTH_KEY: ${{ secrets.THREATFOX_AUTH_KEY }}
        run: node scripts/build-threat-snapshot.mjs
      - name: Build normalized threat-intel snapshot
        env:
          ENABLE_THREATFOX: ${{ vars.ENABLE_THREATFOX }}
          THREATFOX_AUTH_KEY: ${{ secrets.THREATFOX_AUTH_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: node scripts/build-threat-intel-snapshot.mjs
      - id: commit
        name: Commit if changed
        run: |
          git config user.name "Offline Theory snapshot bot"
          git config user.email "snapshot@offlinetheory.github.io"
          git add public/data/threat-intel-snapshot.json public/data/sources-snapshot.json public/data/kev-snapshot.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Threat map: refresh snapshots"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: snapshot
    if: needs.snapshot.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.snapshot.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
