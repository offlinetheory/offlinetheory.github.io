name: Refresh threat-map snapshot

# Fetches the CISA Known Exploited Vulnerabilities catalog (which browsers
# cannot fetch directly — no CORS headers), SANS DShield source and top-port
# rankings (geolocated server-side; topports uses the previous UTC day).
# ThreatFox IOCs are disabled
# unless explicitly enabled after commercial-use eligibility is confirmed
# or a paid subscription is obtained. The job also fetches NVD data and
# fetches Cloudflare Radar's aggregated Layer 7 origin-to-target country pairs,
# and publishes same-origin snapshots every 15 minutes. GitHub Actions may
# delay scheduled runs, so publication cadence is best effort. It does NOT
# deploy Pages itself: the snapshot commit is a push to main, and
# .github/workflows/deploy.yml already builds and deploys Pages on every
# push to main. (An earlier second deploy job here raced that deploy and
# failed a Pages deployment on 2026-11-26, so it was removed.)
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build snapshots
        env:
          ENABLE_THREATFOX: ${{ vars.ENABLE_THREATFOX }}
          THREATFOX_AUTH_KEY: ${{ secrets.THREATFOX_AUTH_KEY }}
        run: node scripts/build-threat-snapshot.mjs
      - name: Build normalized threat-intel snapshot
        env:
          ENABLE_THREATFOX: ${{ vars.ENABLE_THREATFOX }}
          THREATFOX_AUTH_KEY: ${{ secrets.THREATFOX_AUTH_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          CLOUDFLARE_RADAR_API_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_API_TOKEN }}
        run: node scripts/build-threat-intel-snapshot.mjs
      - name: Commit if changed
        run: |
          git config user.name "Offline Theory snapshot bot"
          git config user.email "snapshot@offlinetheory.github.io"
          # Stage every snapshot under public/data (the directory holds only
          # snapshot output). An explicit file list, or a pathspec naming a
          # history directory, breaks the whole run when that file set is
          # empty — run #9 on 2026-11-26 failed here because no timeseries
          # history directory existed yet (every timeseries cell was
          # non-live), so `git add -A .../cloudflare-timeseries` exited 128
          # and nothing was committed. Staging the directory instead survives
          # an empty file set and also stages pruned-history deletions.
          git add -A public/data
          git diff --cached --quiet || git commit -m "Threat map: refresh snapshots"
          git push
